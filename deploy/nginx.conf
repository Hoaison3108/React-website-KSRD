# CẤU HÌNH CHO GIAO DIỆN TRANG WEB CHÍNH (FRONTEND)
server {
    listen 80;
    
    # ⚠️ THAY BẰNG TÊN MIỀN CỦA BẠN CHỖ NÀY
    server_name tenmiencuaban.com www.tenmiencuaban.com;

    # Nginx đâm thẳng vào thư mục chứa code React (thư mục dist)
    root /var/www/ksrd/html;
    index index.html;

    # Ghi log lượt truy cập
    access_log /var/log/nginx/ksrd-frontend-access.log;
    error_log /var/log/nginx/ksrd-frontend-error.log;

    location / {
        # Luật sống còn của React Router (Chống lỗi Not Found 404 khi người dùng refresh trang)
        try_files $uri $uri/ /index.html;
    }

    # Bật nén GZIP để ảnh và văn bản nhẹ đi phân nửa
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";
}

# =======================================================

# CẤU HÌNH CHO UPLOAD SERVER TRONG BÓNG TỐI (BACKEND)
server {
    listen 80;

    # ⚠️ THAY BẰNG TÊN MIỀN ÚP ẢNH CỦA BẠN (VD: api.tenmiencuaban.com)
    server_name api.tenmiencuaban.com;

    # Nới lỏng kích thước cổ họng để được phép nuốt file to (Dung lượng 50 Megabytes)
    client_max_body_size 50M;

    access_log /var/log/nginx/ksrd-backend-access.log;
    error_log /var/log/nginx/ksrd-backend-error.log;

    # Route 1: Chuyển hướng MỌI giao tiếp API vào trạm trộn Node.js Cổng 5000
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Route 2: Cung cấp đường xả thẳng thư mục Hình ảnh ra công chúng (Tốc độ Nginx rất nhanh)
    location /images/ {
        # Đảm bảo đường dẫn này trỏ ĐÚNG vào folder ảnh trong Project
        alias /var/www/ksrd/api/public/images/;
        
        # Nhồi thuốc lắc cho Trình duyệt: Lưu cache ảnh luôn trên máy khách trong 30 ngày
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
